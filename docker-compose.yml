services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: facturacion
      POSTGRES_USER: facturacion
      POSTGRES_PASSWORD: facturacion
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturacion -d facturacion"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    command: uv run uvicorn facturacion.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://facturacion:facturacion@db:5432/facturacion}
      SIFEN_AMBIENTE: ${SIFEN_AMBIENTE:-test}
      SIFEN_CERT_PATH: ${SIFEN_CERT_PATH:-/app/secrets/certificado.pfx}
      SIFEN_CERT_PASSWORD: ${SIFEN_CERT_PASSWORD:-}
      SIFEN_CSC: ${SIFEN_CSC:-}
      SIFEN_CSC_ID: ${SIFEN_CSC_ID:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets
      - ./var:/app/var

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    command: uv run python -m facturacion.worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://facturacion:facturacion@db:5432/facturacion}
      SIFEN_AMBIENTE: ${SIFEN_AMBIENTE:-test}
      SIFEN_CERT_PATH: ${SIFEN_CERT_PATH:-/app/secrets/certificado.pfx}
      SIFEN_CERT_PASSWORD: ${SIFEN_CERT_PASSWORD:-}
      SIFEN_CSC: ${SIFEN_CSC:-}
      SIFEN_CSC_ID: ${SIFEN_CSC_ID:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets
      - ./var:/app/var

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
